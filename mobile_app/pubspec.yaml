name: school_mobile_app
description: "Production-ready Mobile Application for Teachers and Guardians (School SaaS)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking & HTTP
  dio: ^5.7.0

  # Secure Storage & Session Management
  flutter_secure_storage: ^9.2.2

  # Document Download & Sharing
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  open_file: ^3.3.2
  file_picker: ^8.1.4

  # Formatting & UI
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
